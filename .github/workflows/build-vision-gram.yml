name: Build Vision Gram

on:
  workflow_dispatch:
  push:
    branches: [ vision-gram ]
    paths-ignore: [ '**.md' ]

permissions:
  contents: write

concurrency:
  group: build-vision-gram
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 355

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /Users/runner/Library/Android /usr/local/share/dotnet /usr/local/lib/node_modules /Users/runner/.dotnet /Users/runner/hostedtoolcache || true
          df -h /

      - name: Check secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Нет секретов TG_API_ID / TG_API_HASH (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          WANT=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_$WANT.app" ]; then
            X="/Applications/Xcode_$WANT.app"
          else
            X=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
            echo "::warning::Xcode $WANT не найден, используется $X"
          fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Prepare build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'EOF'
          import json, os
          cfg = json.load(open("build-system/appstore-configuration.json"))
          cfg["api_id"] = os.environ["TG_API_ID"].strip()
          cfg["api_hash"] = os.environ["TG_API_HASH"].strip()
          json.dump(cfg, open("build-system/vision-gram-configuration.json", "w"), indent=2)
          print("configuration ready")
          EOF

      - name: Move sources to canonical directory
        run: |
          # пути к исходникам попадают в бинарник — держим их одинаковыми между сборками
          sudo mkdir -p /Users/Shared
          sudo chown "$(whoami)" /Users/Shared
          mv "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios
          mkdir -p "$GITHUB_WORKSPACE"
          df -h /

      - name: Build IPA
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          BUILD_NUMBER=$(( $(cat build_number_offset) + ${{ github.run_number }} ))
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/vision-gram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --disableProvisioningProfiles \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p /Users/Shared/out
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" "/Users/Shared/out/VisionGram-$APP_VERSION-$BUILD_NUMBER.ipa"
          done
          ls -la /Users/Shared/out

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/out/*.ipa
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          name: Vision Gram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: /Users/Shared/out/*.ipa
          body: |
            Неподписанная сборка Vision Gram. Установка: скачать .ipa → Feather → подписать своим сертификатом.
            В Feather укажи Bundle Identifier: com.visiongram.app
